<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OmniAgent</title>
    <style>
      :root { color-scheme: light dark; --canvas: #f2f4f1; --ink: #13201b; --muted: #5c6a63; --primary: #1e5b47; --on-primary: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #0f1613; --ink: #e6eee9; --muted: #93a39a; --primary: #6cc7a1; --on-primary: #0b1f16; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--canvas); color: var(--ink);
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 16px 0 6px; }
      p { color: var(--muted); margin: 0 auto 20px; max-width: 28ch; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="var(--primary)" />
        <circle cx="20" cy="20" r="10.5" fill="none" stroke="var(--on-primary)" stroke-width="2.4" />
        <circle cx="22.6" cy="18.1" r="3.4" fill="var(--on-primary)" />
        <circle cx="28.9" cy="11.7" r="1.9" fill="#E9B45E" />
      </svg>
      <h1>Sin conexión</h1>
      <p>Omni necesita internet para trabajar. Revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
