# Netlify compila Next.js con su adaptador oficial (se detecta solo). Las variables de entorno se configuran en
# Netlify (Project configuration → Environment variables); ver docs/DEPLOY.md.
[build]
  command = "node scripts/netlify-build.mjs"
  publish = ".next"

[build.environment]
  # Node 24 trae npm 11: el npm 10 de Node 22 falla al resolver estas dependencias ("reading 'edgesOut'").
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador de Next.js para Netlify (funciones del servidor, API y proxy de sesión). Se declara explícito porque los
# proyectos creados por API no lo instalan solos.
[[plugins]]
  package = "@netlify/plugin-nextjs"
