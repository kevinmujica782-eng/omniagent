# App de Android: genera el proyecto nativo con Capacitor (modo hosted: abre la web publicada), los íconos y la pantalla
# de carga, y compila el .aab firmado para Google Play y un .apk firmado para instalar directo en un teléfono.
#
# Llave de subida de Google Play: mobile/keystore/omniagent-upload.p12 (PKCS12 cifrado; sin su contraseña no sirve).
# La contraseña NO está en el repositorio. Dos formas de darla:
#   - Secreto del repositorio ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions), recomendado.
#   - O el campo "keystore_password" al correr el workflow (se lee del evento y se oculta en los logs).
# Opcional: secreto ANDROID_KEYSTORE_BASE64 para usar otra llave en lugar del archivo del repositorio.
# La web que abre la app: campo server_url o variable CAP_SERVER_URL (Settings → Secrets and variables → Variables).
name: App de Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (versionName)"
        required: true
        default: "1.0.0"
      server_url:
        description: "URL de la web (vacío = variable CAP_SERVER_URL)"
        required: false
        default: "https://omniagent-app.netlify.app"
      keystore_password:
        description: "Contraseña de la llave (vacío = secreto ANDROID_KEYSTORE_PASSWORD)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar .aab y .apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Node 24 trae npm 11 (el npm 10 de Node 22 no resuelve estas dependencias).
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Llave de firma y URL
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          case "$CAP_SERVER_URL" in
            https://*) echo "La app abrirá $CAP_SERVER_URL" ;;
            *) echo "::error::Falta CAP_SERVER_URL (https://...)"; exit 1 ;;
          esac
          # La contraseña del formulario se lee del evento (no del texto del script) y se oculta antes de usarla.
          password="$SECRET_PASSWORD"
          if [ -z "$password" ]; then password=$(jq -r '.inputs.keystore_password // empty' "$GITHUB_EVENT_PATH"); fi
          if [ -z "$password" ]; then echo "::error::Falta la contraseña de la llave (secreto ANDROID_KEYSTORE_PASSWORD o campo keystore_password)"; exit 1; fi
          echo "::add-mask::$password"
          store="$RUNNER_TEMP/upload.p12"
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$store"; else cp mobile/keystore/omniagent-upload.p12 "$store"; fi
          keytool -list -keystore "$store" -storetype PKCS12 -storepass "$password" > /dev/null || { echo "::error::La contraseña no abre la llave"; exit 1; }
          {
            echo "ANDROID_KEYSTORE_PATH=$store"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=${SECRET_ALIAS:-omniagent}"
          } >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Crear el proyecto Android (si no está en el repositorio)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Íconos y pantalla de carga
        run: |
          npx --yes @capacitor/assets@3 generate --android --assetPath mobile/assets \
            --iconBackgroundColor '#1E5B47' --iconBackgroundColorDark '#1E5B47' \
            --splashBackgroundColor '#F2F4F1' --splashBackgroundColorDark '#0F1613'

      - name: Sincronizar web y plugins
        run: npx cap sync android

      - name: Versión y firma
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" "$gradle"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$gradle"
          cat >> "$gradle" <<'GRADLE'

          // Firma de la versión de Google Play (la agrega el workflow; la llave llega por secretos).
          android {
              signingConfigs {
                  upload {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storeType "pkcs12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE
          grep -nE "versionCode|versionName|applicationId|targetSdk|compileSdk" "$gradle" android/variables.gradle || true

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/omniagent-${{ inputs.version_name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/omniagent-${{ inputs.version_name }}.apk"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Guardar el .aab y el .apk
        uses: actions/upload-artifact@v7
        with:
          name: omniagent-android-${{ inputs.version_name }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
