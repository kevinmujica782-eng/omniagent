# App de Android: genera el proyecto nativo con Capacitor (modo hosted: abre la web publicada), los íconos y la pantalla
# de carga, y compila el .aab firmado para Google Play y un .apk firmado para instalar directo en un teléfono.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   llave de subida (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña de la llave (la misma para el almacén y la clave)
#   ANDROID_KEY_ALIAS         alias de la clave (omniagent)
# Variables (Settings → Secrets and variables → Actions → Variables):
#   CAP_SERVER_URL            URL pública HTTPS de la web (por ejemplo https://omniagent.netlify.app)
#   NEXT_PUBLIC_REVENUECAT_ANDROID_KEY no se usa aquí: va en el hosting de la web, que es lo que abre la app.
name: App de Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (versionName)"
        required: true
        default: "1.0.0"
      server_url:
        description: "URL de la web (vacío = variable CAP_SERVER_URL)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar .aab y .apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar configuración
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          case "$CAP_SERVER_URL" in
            https://*) echo "La app abrirá $CAP_SERVER_URL" ;;
            *) echo "::error::Falta CAP_SERVER_URL (https://...)"; exit 1 ;;
          esac
          if [ -z "$KEYSTORE" ]; then echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; fi

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Crear el proyecto Android (si no está en el repositorio)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Íconos y pantalla de carga
        run: |
          npx --yes @capacitor/assets@3 generate --android --assetPath mobile/assets \
            --iconBackgroundColor '#1E5B47' --iconBackgroundColorDark '#1E5B47' \
            --splashBackgroundColor '#F2F4F1' --splashBackgroundColorDark '#0F1613'

      - name: Sincronizar web y plugins
        run: npx cap sync android

      - name: Versión y firma
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" "$gradle"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$gradle"
          cat >> "$gradle" <<'GRADLE'

          // Firma de la versión de Google Play (la agrega el workflow; la llave llega por secretos).
          android {
              signingConfigs {
                  upload {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE
          grep -nE "versionCode|versionName|applicationId|targetSdk|compileSdk" "$gradle" android/variables.gradle || true

      - name: Compilar
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/omniagent-${{ inputs.version_name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/omniagent-${{ inputs.version_name }}.apk"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Guardar el .aab y el .apk
        uses: actions/upload-artifact@v7
        with:
          name: omniagent-android-${{ inputs.version_name }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
