# Temporal: genera package-lock.json con Node 24 / npm 11 (el mismo npm de Netlify y de CI) y lo sube a esta rama.
# Se borra en cuanto el archivo queda en la rama.
name: Generar package-lock.json

on:
  push:
    branches: [seguridad-y-escala]
    paths: [package.json, .github/workflows/lockfile.yml]

permissions:
  contents: write

jobs:
  lock:
    name: Resolver y subir package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolver versiones exactas (no instala nada)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Subir package-lock.json
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fija las versiones de las librerías: package-lock.json (Node $(node -v), npm $(npm -v))"
          git push
