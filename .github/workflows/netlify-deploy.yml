# Publica la web en Netlify sin conectar el repositorio desde Netlify: sube el código y Netlify lo compila en su
# propio sistema (netlify.toml). El proxy_path lo entrega la herramienta deploy-site del MCP de Netlify y vence
# pronto: pide uno nuevo para cada publicación.
name: Publicar en Netlify

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "ID del proyecto de Netlify"
        required: true
        default: "00d0338c-3967-4da0-824d-c1c023327283"
      proxy_path:
        description: "proxy-path de deploy-site (Netlify MCP)"
        required: true

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Subir y compilar en Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publicar
        env:
          SITE_ID: ${{ inputs.site_id }}
          PROXY_PATH: ${{ inputs.proxy_path }}
        run: |
          echo "::add-mask::$PROXY_PATH"
          set +e
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          code=${PIPESTATUS[0]}
          set -e
          # Las últimas líneas también como anotación, para leerlas sin abrir el log completo.
          summary=$(tail -n 60 "$RUNNER_TEMP/deploy.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ "$code" -ne 0 ]; then echo "::error title=Netlify::${summary}"; exit "$code"; fi
          echo "::notice title=Netlify::${summary}"
